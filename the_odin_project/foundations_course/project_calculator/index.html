<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="main-container">
            <div class="display">
                <input class="history" id="history-display" type="text" readonly />
                <input class="result" id="result-display" type="text" readonly />
            </div>
            <div class="keypad">
                <button data-type="number" data-value="7">7</button>
                <button data-type="number" data-value="8">8</button>
                <button data-type="number" data-value="9">9</button>
                <button data-type="operator" data-value="divide">&divide;</button>
                <button data-type="number" data-value="4">4</button>
                <button data-type="number" data-value="5">5</button>
                <button data-type="number" data-value="6">6</button>
                <button data-type="operator" data-value="minus">&minus;</button>
                <button data-type="number" data-value="1">1</button>
                <button data-type="number" data-value="2">2</button>
                <button data-type="number" data-value="3">3</button>
                <button data-type="operator" data-value="multiply">&times;</button>
                <button data-type="operator" data-value="clear">C</button>
                <button data-type="operator" data-value="delete">DEL</button>
                <button data-type="number" data-value="0">0</button>
                <button data-type="operator" data-value="add">&plus;</button>
                <button data-type="operator" data-value="equal">&equals;</button>
            </div>
        </div>
    </body>
</html>
